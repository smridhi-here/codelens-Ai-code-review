# Used when SPRING_PROFILES_ACTIVE=prod (deployed). Everything comes from
# environment variables set on the hosting service.

# PostgreSQL (e.g. Neon): jdbc:postgresql://HOST/DBNAME?sslmode=require
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update

# Small pool: free hosting has little memory and the DB sleeps when idle.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=240000

# No default on purpose: the app refuses to start without a real secret.
app.jwt.secret=${JWT_SECRET}
