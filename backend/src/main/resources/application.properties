server.port=${PORT:8080}
server.error.include-message=always

# Default database: H2 file DB (no install needed). Data survives restarts
# and is stored in ./data/codelens.mv.db
spring.datasource.url=jdbc:h2:file:./data/codelens
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate creates/updates the tables (reviews, issues) from the entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Where the Python AI engine runs
ai.engine.url=${AI_ENGINE_URL:http://localhost:8000}
# Shared secret sent to the engine (set the same ENGINE_API_KEY on both when deployed)
ai.engine.key=${ENGINE_API_KEY:}

# Websites allowed to call this API (comma separated). Set CORS_ORIGINS when deployed.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ---- Login / JWT ----
# Secret used to sign login tokens. Change it (32+ characters) or set the
# JWT_SECRET environment variable. Tokens stay valid for 24 hours.
app.jwt.secret=${JWT_SECRET:codelens-dev-secret-change-me-please-0123456789}
app.jwt.expiration-hours=24
# Hide Spring's auto-generated default password line from the console.
logging.level.org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration=ERROR
